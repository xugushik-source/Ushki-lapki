name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is claude/paws-ears-vet-engine-mbzyvz, not
    # main (the repo started empty and was never pushed to main) — trigger
    # on whichever one is actually current so this fires on the next push.
    branches:
      - claude/paws-ears-vet-engine-mbzyvz
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # This repo is a project page, not a <owner>.github.io root repo,
          # so GitHub Pages serves it from /<repo>/ — every asset and link
          # needs that prefix baked in at build time (see next.config.ts
          # and src/lib/imageLoader.ts). Derived from the repo itself so
          # this keeps working if the repo is ever renamed or forked.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
